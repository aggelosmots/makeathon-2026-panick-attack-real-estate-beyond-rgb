<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real Estate Beyond RGB</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body data-page="user">
  <header class="topbar">
    <a class="brand" href="/" aria-label="Real Estate Beyond RGB home">
      <img class="brand-logo" src="/static/logo.png" alt="EDAFOS">
      <span>
        <strong>EΔAFOS</strong>
      </span>
    </a>
    <nav class="topnav" aria-label="Primary navigation">
      <a class="active" href="/">Analysis</a>
      <a href="/devel">Developer</a>
    </nav>
  </header>

  <main class="workspace">
    <section class="prompt-panel compact" aria-label="Analysis request">
      <form id="prompt-form" class="prompt-form">
        <label class="dataset-field" for="dataset-select">
          Dataset
          <select id="dataset-select" name="dataset" multiple size="4"></select>
        </label>
        <label class="sr-only" for="prompt-input">Prompt</label>
        <input id="prompt-input" name="prompt" type="text" autocomplete="off" placeholder="Compare selected data and recommend the best parcel...">
        <button class="button primary" type="submit">Send</button>
      </form>
    </section>

    <section class="report-layout single">
      <section class="report-panel" aria-labelledby="report-title">
        <div class="section-head">
          <div>
            <h2 id="report-title">Investment Analysis</h2>
          </div>
          <div class="report-actions">
            <button class="button download-button" type="button" data-download-format="md" disabled>MD</button>
            <button class="button download-button" type="button" data-download-format="pdf" disabled>PDF</button>
            <button class="button download-button" type="button" data-download-format="docx" disabled>DOCX</button>
            <div id="run-status" class="run-status" aria-live="polite">Idle</div>
          </div>
        </div>
        <div id="report-output" class="report-output empty">
          No report yet.
        </div>
        <div id="figures-output" class="figures-grid hidden"></div>
      </section>
    </section>

    <section id="trace-section" class="trace-section hidden" aria-labelledby="trace-title">
      <div class="section-head">
        <div>
          <h2 id="trace-title">Data Used</h2>
        </div>
      </div>
      <div id="trace-output" class="trace-list"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
